plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.danzfadlullah.lynx'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.danzfadlullah.lynx"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0-alpha"

        // ARM64 primary, armeabi-v7a optional for older 32-bit devices
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // Keep surface alive across rotations; DAW is landscape-first
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -ffp-contract=off -O2 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            // JNI libs from CMake
            jniLibs.srcDirs = ['src/main/cpp/libs']
        }
    }

    // Landscape orientation enforced in Manifest; lock here too for safety
    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/*.version'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
