name: Tests

on:
  push:
    branches: [main, 'wip/**']
  pull_request:

# A newer push to the same branch cancels the older run (work branches are pushed often); main keeps every run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JUCE_VERSION: 8.0.4
  JUCE_SHA256: 0effe9823a6fd8a4f98e5c08be7d308350e417b2d15dcf34011e778fefbbf005

jobs:
  server:
    name: Server limits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # (the runners' package mirror sometimes fails to resolve for a minute: try again instead of failing the job)
      - run: for i in 1 2 3 4 5 6; do sudo apt-get update -q && sudo apt-get install -y -q python3-aiohttp && break; [ $i = 6 ] && exit 1; sleep 30; done
      - run: /usr/bin/python3 -m unittest discover -s server/tests -p 'test_*.py' -v

  # Round speed185a: a Core job took 76-130 min, ~90 % of it compiling the core again for every tool (now once, in
  # parallel: scripts/cxx-once.sh) and the rest running the tests one by one (now in parallel shards, then the
  # timing-sensitive ones alone: scripts/run-tests.sh). ccache keeps the objects between runs: main saves the cache,
  # every other branch starts from main's. Every test still runs in every job.
  core:
    name: Core (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # opt (round toolchain190gt): the Clang job compiles with the Windows release's flags (zig = the same LLVM; its
        # ThinLTO is covered by build-local's own zig build), so the bit-exact goldens check that codegen
        include:
          - { os: ubuntu-24.04, compiler: g++, opt: '-O2' }
          - { os: ubuntu-24.04, compiler: clang++, opt: '-O2 -fno-math-errno' }
          - { os: macos-15, compiler: clang++, opt: '-O2' }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v5
      - name: ccache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get install -y -q ccache > /dev/null || for i in 1 2 3 4 5 6; do sudo apt-get update -q && sudo apt-get install -y -q ccache && break; [ $i = 6 ] && exit 1; sleep 30; done
          else brew list ccache > /dev/null 2>&1 || brew install ccache; fi
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-core-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-core-${{ matrix.os }}-${{ matrix.compiler }}-
      - name: Build and test the core (no JUCE)
        env:
          CXX: ccache ${{ matrix.compiler }}
          LYNX_OPT_FLAGS: ${{ matrix.opt }}
          LYNX_TEST_JOBS: auto
        run: |
          ccache --zero-stats > /dev/null # (after the restore: the statistics live in the cache folder)
          ./scripts/build-local.sh
      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .ccache
          key: ccache-core-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: build-local/lynx_tests.shards
          retention-days: 7
          if-no-files-found: ignore

  # The whole app (JUCE) on Linux and macOS: it must build and pass its self-test. Windows is built by release.yml.
  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5 6; do
            sudo apt-get update -q && sudo apt-get install -y -q ccache ninja-build pkg-config xvfb libasound2-dev libjack-jackd2-dev libx11-dev libxrandr-dev \
              libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev && break
            [ $i = 6 ] && exit 1; sleep 30
          done

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew list ninja > /dev/null 2>&1 || brew install ninja
          brew list ccache > /dev/null 2>&1 || brew install ccache

      # (round speed185a) ccache between runs: main saves it, other branches start from main's
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-app-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-app-${{ matrix.os }}-

      - name: JUCE (checksum verified)
        shell: bash
        run: |
          curl -fsSL -o juce.tar.gz "https://github.com/juce-framework/JUCE/archive/refs/tags/$JUCE_VERSION.tar.gz"
          echo "$JUCE_SHA256  juce.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/juce" && tar xzf juce.tar.gz -C "$RUNNER_TEMP/juce" --strip-components 1 && rm juce.tar.gz

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats > /dev/null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_JUCE="$RUNNER_TEMP/juce" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DLYNX_LTO=OFF
          cmake --build build --target LYNX -- -k 0
          ccache --show-stats || true

      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .ccache
          key: ccache-app-${{ matrix.os }}-${{ github.sha }}

      - name: Self-test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bin=build/LYNX_artefacts/Release/LYNX; run=(xvfb-run -a)
          else
            bin=build/LYNX_artefacts/Release/LYNX.app/Contents/MacOS/LYNX; run=()
          fi
          "${run[@]}" "$bin" --selftest "$PWD/selftest.txt" "$PWD/selftest-demo.lynx" || true
          cat selftest.txt
          grep -q '^result=OK' selftest.txt

      # Issue #85: no LV2 child while nothing changed, one when something did; a child that fails changes nothing
      - name: LV2 scan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LYNX_PROFILE_DIR="$PWD/lv2-profile" xvfb-run -a build/LYNX_artefacts/Release/LYNX --lv2scantest "$PWD/lv2scan.txt" || true
          cat lv2scan.txt
          grep -q '^result=OK' lv2scan.txt

      # Round 170c (issue #11): the plugin editors as this platform draws them (macOS = CoreGraphics), one PNG each,
      # and the renderer probe (gradient text / empty paths must stay inside their shapes). Kept as an artifact.
      - name: Editor pictures
        if: always()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bin=build/LYNX_artefacts/Release/LYNX; run=(xvfb-run -a)
          else
            bin=build/LYNX_artefacts/Release/LYNX.app/Contents/MacOS/LYNX; run=()
          fi
          mkdir -p editor-pictures
          "${run[@]}" "$bin" --gfxprobe "$PWD/editor-pictures/gfxprobe.txt" || true
          cat editor-pictures/gfxprobe.txt || true
          perl -e 'alarm shift; exec @ARGV' 600 "${run[@]}" "$bin" --steppertest "$PWD/editor-pictures/steppertest.txt" || true
          tail -3 editor-pictures/steppertest.txt || true
          perl -e 'alarm shift; exec @ARGV' 1200 "${run[@]}" "$bin" --plugui "$PWD/editor-pictures" || true
          ls editor-pictures | wc -l

      - name: Upload the editor pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-pictures-${{ runner.os }}
          path: editor-pictures
          retention-days: 14

      # A plugin that kills the scan's child process is blacklisted, not described again at every start
      - name: Crashing plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir crash-plugin
          echo 'void __attribute__ ((constructor)) crash (void) { __builtin_trap(); }' | cc -shared -fPIC -x c - -o crash-plugin/crash.clap
          LYNX_PROFILE_DIR="$PWD/crash-profile" xvfb-run -a build/LYNX_artefacts/Release/LYNX --scantest "$PWD/crash-plugin" "$PWD/crash.txt" || true
          cat crash.txt
          grep -q 'blacklisted: .*crash.clap' crash.txt

      # Issue #155: a VST3 that ignores bus activation (as every nih-plug plugin does) reads its sidechain bus while LYNX
      # keeps that bus off; JUCE passed null sample pointers there (nih-plug: memcpy from null, LYNX crashed). The test
      # plugin goes silent on a null pointer, so this fails (peak=0) unless the off bus holds silence (cmake fix 24).
      - name: Inactive sidechain bus (VST3)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          V="$RUNNER_TEMP/juce/modules/juce_audio_processors/format_types/VST3_SDK"
          B="sc-plugin/LYNX Test Sidechain.vst3/Contents/x86_64-linux"
          mkdir -p "$B"
          c++ -shared -fPIC -O2 -std=c++17 -I"$V" tools/testplugin/lynx_test_sidechain_vst3.cpp "$V/pluginterfaces/base/funknown.cpp" -o "$B/LYNX Test Sidechain.so"
          LYNX_PROFILE_DIR="$PWD/sc-profile" xvfb-run -a build/LYNX_artefacts/Release/LYNX --plugintest "$PWD/sc-plugin/LYNX Test Sidechain.vst3" "$PWD/sc.txt" || true
          cat sc.txt
          grep -q '^result=OK' sc.txt && grep -q '^plugin_crashes=0' sc.txt

      # Round 190dt: a hosted plugin that crashes in its audio processing (a null write, and a memcpy from null as in
      # issue #155) is switched off and LYNX keeps playing, saves and reloads it; a plugin that crashes on its saved state
      # is left out as the project opens; LYNX's own faults inside a plugin call still end in the crash handler.
      # Linux: CLAP + VST3; macOS: CLAP.
      - name: Crashing plugin guard
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bin=build/LYNX_artefacts/Release/LYNX; run=(xvfb-run -a)
          else
            bin=build/LYNX_artefacts/Release/LYNX.app/Contents/MacOS/LYNX; run=()
          fi
          mkdir -p cg-plugins
          cc -shared -fPIC -O2 -Ithird_party/clap/include tools/testplugin/lynx_test_crash.c -o "cg-plugins/LYNX Test Crash.clap"
          plugins=("LYNX Test Crash.clap" "LYNX Test Crash.clap")
          modes=(process memcpy)
          if [[ "$RUNNER_OS" == Linux ]]; then
            V="$RUNNER_TEMP/juce/modules/juce_audio_processors/format_types/VST3_SDK"
            B="cg-plugins/LYNX Test Crash.vst3/Contents/x86_64-linux"
            mkdir -p "$B"
            c++ -shared -fPIC -O2 -std=c++17 -I"$V" tools/testplugin/lynx_test_crash_vst3.cpp "$V/pluginterfaces/base/funknown.cpp" -o "$B/LYNX Test Crash.so"
            plugins+=("LYNX Test Crash.vst3" "LYNX Test Crash.vst3")
            modes+=(process memcpy)
          fi
          status=0
          for i in "${!plugins[@]}"; do
            report="$PWD/crashguard-$i.txt"
            LYNX_PROFILE_DIR="$PWD/cg-profile-$i" perl -e 'alarm shift; exec @ARGV' 600 "${run[@]}" "$bin" --crashguardtest "$PWD/cg-plugins/${plugins[$i]}" "$report" "${modes[$i]}" || true
            echo "--- ${plugins[$i]} (${modes[$i]})"; cat "$report" || true
            grep -q '^result=OK' "$report" || status=1
          done
          exit $status
