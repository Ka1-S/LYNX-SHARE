<figure><a class="shot" href="/assets/img/plugins/fx-utility@2x.webp"><img src="/assets/img/plugins/fx-utility.webp" srcset="/assets/img/plugins/fx-utility.webp 1x, /assets/img/plugins/fx-utility@2x.webp 2x" alt="Utility" width="420" height="246"></a></figure><p>Utility 是处理电平和声道路由的小工具。把它加到插入轨上，可以改变增益、移动平衡，或交换与混合声道。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>增益</td><td>输出增益。</td></tr><tr><td>平衡</td><td>左右之间的平衡。</td></tr><tr><td>L -&gt; L</td><td>左输入到左输出。</td></tr><tr><td>R -&gt; L</td><td>右输入到左输出。</td></tr><tr><td>L -&gt; R</td><td>左输入到右输出。</td></tr><tr><td>R -&gt; R</td><td>右输入到右输出。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>把 L -&gt; R 和 R -&gt; L 调高、其余调低，即可交换声道。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-stereo"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
