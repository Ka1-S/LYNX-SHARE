<figure><a class="shot" href="/assets/img/plugins/fx-tuner@2x.webp"><img src="/assets/img/plugins/fx-tuner.webp" srcset="/assets/img/plugins/fx-tuner.webp 1x, /assets/img/plugins/fx-tuner@2x.webp 2x" alt="Tuner" width="360" height="330"></a></figure><p>Tuner 读取输入音频的音高，并显示音名和八度。把它放在插入轨上，一次弹一个音，就可以给乐器或采样调音。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>参考</td><td>以赫兹为单位的参考音高。</td></tr><tr><td>反应度</td><td>显示跟随信号的快慢。</td></tr><tr><td>低音</td><td>关闭或开启，用于低音。</td></tr><tr><td>可视化</td><td>基本或表盘视图。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>它不会改变声音。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-visual"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
