<figure><a class="shot" href="/assets/img/plugins/fx-frequency-shifter-2@2x.webp"><img src="/assets/img/plugins/fx-frequency-shifter-2.webp" srcset="/assets/img/plugins/fx-frequency-shifter-2.webp 1x, /assets/img/plugins/fx-frequency-shifter-2@2x.webp 2x" alt="Frequency shifter" width="383" height="246"></a></figure><p>Frequency shifter 是小型效果器槽插件，把信号的所有频率向上或向下移动相同的赫兹数。三个旋钮上方有频谱显示。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>Shift</td><td>以赫兹为单位的移位，正负均可。</td></tr><tr><td>立体声</td><td>效果的立体声量。</td></tr><tr><td>混合</td><td>干声与湿声的平衡。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>几赫兹的小幅移位会产生缓慢的拍音，大幅移位则使声音变得非谐波。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-pitch"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
