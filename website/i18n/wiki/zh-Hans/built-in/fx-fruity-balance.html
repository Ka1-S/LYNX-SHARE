<figure><a class="shot" href="/assets/img/plugins/fx-fruity-balance@2x.webp"><img src="/assets/img/plugins/fx-fruity-balance.webp" srcset="/assets/img/plugins/fx-fruity-balance.webp 1x, /assets/img/plugins/fx-fruity-balance@2x.webp 2x" alt="Fruity Balance" width="334" height="176"></a></figure><p>最简单的混音台工具。它把立体声平衡移向左声道或右声道，并设置输出音量。它会从导入的 FL Studio 工程中读取对应效果器的设置。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>平衡</td><td>在左右声道之间移动信号；中间位置保持原样。</td></tr><tr><td>音量</td><td>输出电平，以 dB 显示。</td></tr><tr><td>Meters</td><td>显示左右声道的电平。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>用它来校正左右不平衡的录音，或在插入轨链的末尾微调电平。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-stereo"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
