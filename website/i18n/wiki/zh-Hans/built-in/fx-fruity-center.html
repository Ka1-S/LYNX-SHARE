<figure><a class="shot" href="/assets/img/plugins/fx-fruity-center@2x.webp"><img src="/assets/img/plugins/fx-fruity-center.webp" srcset="/assets/img/plugins/fx-fruity-center.webp 1x, /assets/img/plugins/fx-fruity-center@2x.webp 2x" alt="Fruity Center" width="327" height="81"></a></figure><p>用于混音台插入轨的小工具。它运行一个去除直流的高通滤波器，把波形重新居中到零点。它会从导入的 FL Studio 工程中打开对应效果器的设置。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>状态</td><td>开启或关闭。</td></tr><tr><td>开</td><td>滤波器去除直流偏移。</td></tr><tr><td>关</td><td>信号原样通过。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>当音源带有恒定偏移时，把它放在链的前面，位于压缩器或限制器之前。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-eq"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
