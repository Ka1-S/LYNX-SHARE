<figure><a class="shot" href="/assets/img/plugins/fx-eq@2x.webp"><img src="/assets/img/plugins/fx-eq.webp" srcset="/assets/img/plugins/fx-eq.webp 1x, /assets/img/plugins/fx-eq@2x.webp 2x" alt="EQ" width="420" height="282"></a></figure><p>EQ 是基础的效果器槽插件，用于快速修正音色。它有低频段、中心频率可移动的中频段和高频段，旋钮上方画出合成后的曲线。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>低</td><td>低频段的增益。</td></tr><tr><td>中</td><td>中频段的增益。</td></tr><tr><td>中频频率</td><td>中频段的中心频率。</td></tr><tr><td>高</td><td>高频段的增益。</td></tr><tr><td>输出</td><td>输出电平。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>需要更多频段、频谱和动态频段时，请用 Facet EQ。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-eq"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
