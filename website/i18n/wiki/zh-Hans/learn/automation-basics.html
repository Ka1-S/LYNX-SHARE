<h2 id="create-an-automation-clip">创建自动化片段</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-1.webp"><img src="/assets/img/learn/automation-basics-1.webp" alt="旋钮的菜单：Create automation clip" loading="lazy" width="840" height="630"></a></figure>
<ol><li>右键点击任意旋钮，这里是合成器的 Cutoff，然后选择 <code>创建自动化片段</code>。</li><li>片段会放进播放列表，长度和样式一样，并且 Channel rack 中会出现它的通道。</li></ol>
<h2 id="shape-the-curve">塑造曲线</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-2.webp"><img src="/assets/img/learn/automation-basics-2.webp" alt="自动化编辑器" loading="lazy" width="1060" height="700"></a></figure>
<ol><li>自动化编辑器会打开，显示该片段的曲线。之后想再打开，请右键点击旋钮并选择 <code>编辑自动化片段...</code>。</li><li>拖动点来塑造曲线；点击可添加点。这里 Cutoff 从高处开始，在一个小节内下降。</li></ol>
<h2 id="hear-it">听听效果</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-3.webp"><img src="/assets/img/learn/automation-basics-3.webp" alt="旋钮跟随曲线" loading="lazy" width="760" height="285"></a></figure>
<ol><li>在歌曲模式中按播放：每次播放歌曲时，旋钮都会跟随曲线。</li><li>在简易布局中，<code>自动化</code> 按钮会在每条音轨下显示一条可以绘制的轨道。</li></ol>
<p>另见<a href="/wiki/automation/">自动化</a>。</p>
