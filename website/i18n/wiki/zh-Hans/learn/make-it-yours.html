<h2 id="theme-presets">主题预设</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-1.webp"><img src="/assets/img/learn/make-it-yours-1.webp" alt="主题预设" loading="lazy" width="690" height="685"></a></figure>
<ol><li>打开 <code>选项 › 主题（颜色、背景）...</code>。</li><li>选择一个预设：LYNX、Ocean、Emerald、Amber、Violet 或 Graphite。<code>默认</code> 会恢复 LYNX 自己的主题。</li></ol>
<h2 id="colours-and-text-size">颜色和文字大小</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-2.webp"><img src="/assets/img/learn/make-it-yours-2.webp" alt="General 页面中的文字大小和粗体文字" loading="lazy" width="690" height="685"></a></figure>
<ol><li>旋钮可调整色相、饱和度、亮度和对比度；每个圆点为一个部分上色，比如音轨或电平表。</li><li>在 <code>常规</code> 页面中，<code>文字大小</code> 和 <code>粗体文字</code> 能让界面更易读。</li></ol>
<h2 id="language-and-restart">语言和重启</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-3.webp"><img src="/assets/img/learn/make-it-yours-3.webp" alt="重启后文字更大更粗的 LYNX" loading="lazy" width="1280" height="720"></a></figure>
<ol><li><code>语言</code> 列出 LYNX SHARE 的十五种语言。</li><li>新的语言、字体、文字大小或粗体文字会在 LYNX SHARE 再次启动时生效。</li></ol>
<p>另见<a href="/wiki/settings/">设置</a>。</p>
