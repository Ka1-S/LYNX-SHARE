<h2 id="the-mixer">混音台</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-1.webp"><img src="/assets/img/learn/mixing-basics-1.webp" alt="每条音轨一个通道条的混音台" loading="lazy" width="940" height="470"></a></figure>
<ol><li>按 <code>F9</code> 打开混音台。每条音轨都有一个通道条：名称、声像、推子、静音、独奏和电平表。</li><li>左边的主控通道条就是你听到的声音，也是导出时写出的内容。</li></ol>
<h2 id="level-and-pan">电平和声像</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-2.webp"><img src="/assets/img/learn/mixing-basics-2.webp" alt="被拉低的推子" loading="lazy" width="940" height="470"></a></figure>
<ol><li>拖动推子来设置音轨的电平。先调好电平，再加任何效果。</li><li>推子上方的旋钮把音轨声像摆到左边或右边。</li></ol>
<h2 id="mute-solo-and-the-meter">静音、独奏和电平表</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-3.webp"><img src="/assets/img/learn/mixing-basics-3.webp" alt="一条音轨开启了独奏" loading="lazy" width="940" height="470"></a></figure>
<ol><li>绿色开关会让音轨静音；再点一次就恢复。</li><li><code>S</code> 会独奏音轨：只听到它。再点一次，就能听到全部。</li><li>留意主控电平表：让最响的峰值不要进入红色区域。</li></ol>
<p>另见<a href="/wiki/mixer/">混音台</a>。</p>
