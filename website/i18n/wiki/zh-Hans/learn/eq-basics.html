<h2 id="add-an-eq">添加 EQ</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-1.webp"><img src="/assets/img/learn/eq-basics-1.webp" alt="和弦音轨上的 Facet EQ" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>在混音台中选择音轨并点击一个空插槽，然后选择 <code>Facet EQ</code>。</li><li>图表显示声音的频谱。双击图表可添加一个频段。</li></ol>
<h2 id="cut-and-boost">衰减和提升</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-2.webp"><img src="/assets/img/learn/eq-basics-2.webp" alt="低切和 300 Hz 附近的衰减" loading="lazy" width="1000" height="660"></a></figure>
<ol><li>把 80 Hz 附近的频段设为 <code>低切</code>：它会去掉低音下面的隆隆声。</li><li>在 300 Hz 附近添加一个频段并稍微往下拖：浑浊感减少。</li><li>在 3 kHz 附近稍微提升一点，音符就会更靠前。上下拖动频段调整增益，左右拖动调整频率；用滚轮调整宽度。</li></ol>
<h2 id="compare">对比</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-3.webp"><img src="/assets/img/learn/eq-basics-3.webp" alt="试听开关：EQ 和 Source" loading="lazy" width="1000" height="660"></a></figure>
<ol><li>点击 <code>来源</code> 可在相同响度下听没有 EQ 的音轨；点击 <code>EQ</code> 就恢复。</li><li>小幅调整就足够了。多听，少看。</li></ol>
<p>另见<a href="/wiki/mixer/">混音台</a>。</p>
