<h2 id="select-a-track">选择音轨</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-1.webp"><img src="/assets/img/learn/mixer-routing-1.webp" alt="选中了和弦的混音台" loading="lazy" width="1280" height="401"></a></figure>
<ol><li>按 <code>F9</code> 打开混音台。每条音轨都送往主控。</li><li>点击你想发送的音轨，这里是和弦。</li></ol>
<h2 id="route-and-send-level">路由和发送电平</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-2.webp"><img src="/assets/img/learn/mixer-routing-2.webp" alt="路由箭头及其发送旋钮" loading="lazy" width="1040" height="280"></a></figure>
<ol><li>点击另一条音轨下方的箭头：选中的音轨现在也会送到那里，并有一根线缆显示这条路由。</li><li>箭头下方的旋钮是发送电平：决定这条音轨有多少送到那里。</li></ol>
<h2 id="a-reverb-bus">混响总线</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-3.webp"><img src="/assets/img/learn/mixer-routing-3.webp" alt="总线音轨上的混响" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>在那条音轨的第一个插槽加一个混响：路由到那里的每条音轨都共用它，同时保留各自的推子。</li><li>右键点击箭头可看到更多选项：<code>仅路由到此轨道</code> 会移走整条音轨，<code>侧链到此轨道</code> 会发送一个信号供压缩器监听。</li></ol>
<p>另见<a href="/wiki/mixer/">混音台</a>、<a href="/learn/mixing-basics/">混音基础</a>和<a href="/learn/sidechain/">侧链</a>。</p>
