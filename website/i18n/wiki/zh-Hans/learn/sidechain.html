<h2 id="what-sidechain-does">侧链是做什么的</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-1.webp"><img src="/assets/img/learn/sidechain-1.webp" alt="低音在鼓下面让位" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>侧链闪避会在另一条音轨每次发声时压低这条音轨，比如让低音在底鼓下面让位，这样两者都能听清。</li></ol>
<h2 id="duck-under-simple-layout">Duck under（简易布局）</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-2.webp"><img src="/assets/img/learn/sidechain-2.webp" alt="Duck under，Drums" loading="lazy" width="1000" height="480"></a></figure>
<ol><li>选择低音音轨并打开它的效果器标签页。</li><li>点击 <code>闪避于</code> 并选择鼓。低音现在会随着节拍起伏；Duck 卡片上的旋钮决定压得多深。</li></ol>
<h2 id="mixer-sidechain-pattern-layout">混音台侧链（模式布局）</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-3.webp"><img src="/assets/img/learn/sidechain-3.webp" alt="混音台中的 Sidechain to this track" loading="lazy" width="940" height="480"></a></figure>
<ol><li>在混音台中选择鼓音轨，右键点击和弦音轨下方的箭头：<code>侧链到此轨道</code>。</li><li>给和弦音轨添加一个压缩器：它会监听鼓，每次鼓点都把和弦压下去。</li></ol>
<p>另见<a href="/wiki/mixer/">混音台</a>。</p>
