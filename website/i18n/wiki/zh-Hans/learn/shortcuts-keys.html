<h2 id="the-shortcut-sheet">快捷键表</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-1.webp"><img src="/assets/img/learn/shortcuts-keys-1.webp" alt="快捷键表" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>按 <code>F1</code>（或 <code>帮助 › 快捷键</code>）：显示每个窗口的按键，沿用 FL Studio 自己的。再按一次 <code>F1</code> 关闭。</li></ol>
<h2 id="change-a-shortcut">修改快捷键</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-2.webp"><img src="/assets/img/learn/shortcuts-keys-2.webp" alt="Manage shortcuts" loading="lazy" width="870" height="640"></a></figure>
<ol><li>点击快捷键表底部的 <code>管理快捷键...</code>，或打开 <code>选项 › 管理快捷键...</code>。</li><li>搜索一个操作或按键，选中它，点击 <code>更改</code>，然后按下新的按键。</li><li><code>仅已更改</code> 列出你改过的项目；<code>重置为默认</code> 把某个快捷键恢复原样。</li></ol>
<h2 id="the-typing-keyboard">打字键盘</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-3.webp"><img src="/assets/img/learn/shortcuts-keys-3.webp" alt="Piano roll 中演奏打字键盘的音符" loading="lazy" width="1280" height="720"></a></figure>
<ol><li><code>Ctrl+T</code> 打开或关闭打字键盘（<code>选项 › 电脑键盘当钢琴</code>）。</li><li>字母键会演奏选中的乐器：Z 到 M 是一个八度，Q 到 I 是下一个八度。</li></ol>
<p>另见<a href="/wiki/shortcuts/">键盘快捷键</a>。</p>
