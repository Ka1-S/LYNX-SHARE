<figure><a class="shot" href="/assets/img/plugins/fx-fruity-center@2x.webp"><img src="/assets/img/plugins/fx-fruity-center.webp" srcset="/assets/img/plugins/fx-fruity-center.webp 1x, /assets/img/plugins/fx-fruity-center@2x.webp 2x" alt="Fruity Center" width="327" height="81"></a></figure><p>用於混音器插入軌的小工具。它運行一個去除直流的高通濾波器，把波形重新置中到零附近。它會從匯入的 FL Studio 專案開啟對應效果器的設定。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>狀態</td><td>開或關。</td></tr><tr><td>開</td><td>濾波器移除直流偏移。</td></tr><tr><td>關</td><td>訊號原樣通過。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>當訊號源有固定偏移時，把它放在效果鏈的前段，壓縮器或限制器之前。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-eq"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
