<figure><a class="shot" href="/assets/img/plugins/fx-tuner@2x.webp"><img src="/assets/img/plugins/fx-tuner.webp" srcset="/assets/img/plugins/fx-tuner.webp 1x, /assets/img/plugins/fx-tuner@2x.webp 2x" alt="Tuner" width="360" height="330"></a></figure><p>Tuner 讀取輸入音訊的音高，並顯示音名和八度。把它放在插入軌上，一次彈一個音，就能為樂器或取樣調音。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>參考</td><td>參考音高，單位為赫茲。</td></tr><tr><td>反應度</td><td>顯示跟隨訊號的快慢。</td></tr><tr><td>低音</td><td>關或開，用於低音。</td></tr><tr><td>視覺化</td><td>基本或錶盤檢視。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>它不會改變聲音。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-visual"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
