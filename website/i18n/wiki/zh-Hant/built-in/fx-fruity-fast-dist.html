<figure><a class="shot" href="/assets/img/plugins/fx-fruity-fast-dist@2x.webp"><img src="/assets/img/plugins/fx-fruity-fast-dist.webp" srcset="/assets/img/plugins/fx-fruity-fast-dist.webp 1x, /assets/img/plugins/fx-fruity-fast-dist@2x.webp 2x" alt="Fruity Fast Dist" width="386" height="148"></a></figure><p>用於混音器插入軌的簡單失真。訊號先被放大，在閾值處削波，再與乾聲混合。圖形顯示傳輸曲線。它會從匯入的 FL Studio 專案開啟對應效果器的設定。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>前置</td><td>失真之前的輸入增益。</td></tr><tr><td>Thresh</td><td>訊號被削波的電平。</td></tr><tr><td>類型</td><td>在 A 和 B 兩種類型之間切換。</td></tr><tr><td>混合</td><td>乾聲與失真訊號的平衡。</td></tr><tr><td>後置</td><td>輸出增益。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>前置調高時，就調低後置，讓電平保持穩定。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-distortion"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
