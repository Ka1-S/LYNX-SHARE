<figure><a class="shot" href="/assets/img/plugins/fx-filter@2x.webp"><img src="/assets/img/plugins/fx-filter.webp" srcset="/assets/img/plugins/fx-filter.webp 1x, /assets/img/plugins/fx-filter@2x.webp 2x" alt="Filter" width="400" height="270"></a></figure><p>Filter 是簡單的效果器插槽外掛。它是每八度 12 dB 的狀態可變濾波器，控制項上方畫有響應曲線。</p><h2 id="controls" data-i18n="wiki.controls">Controls</h2><div class="tablewrap"><table><thead><tr><th data-i18n="wiki.control">Control</th><th data-i18n="wiki.does">What it does</th></tr></thead><tbody><tr><td>類型</td><td>低通、高通或帶通。</td></tr><tr><td>截止</td><td>截止頻率。</td></tr><tr><td>共振</td><td>截止點附近的強調程度。</td></tr><tr><td>混合</td><td>濾波後訊號與乾訊號的混合比例。</td></tr></tbody></table></div><h2 id="tips" data-i18n="wiki.tips">Tips</h2><ul><li>自動化截止就能做出掃頻。</li></ul><h2 id="related" data-i18n="wiki.related">Related</h2><ul><li><a href="/wiki/built-in/" data-i18n="wiki.relOverview">Built-in instruments and effects: overview</a></li><li><a href="/instruments-and-effects/#g-eq"><span data-i18n="wiki.relCat" data-args='[&quot;205&quot;]'>The catalogue of all 205</span></a></li></ul>
