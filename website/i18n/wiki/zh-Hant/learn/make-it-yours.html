<h2 id="theme-presets">主題預設</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-1.webp"><img src="/assets/img/learn/make-it-yours-1.webp" alt="主題預設" loading="lazy" width="690" height="685"></a></figure>
<ol><li>開啟 <code>選項 › 主題（顏色、背景）...</code>。</li><li>選擇一個預設：LYNX、Ocean、Emerald、Amber、Violet 或 Graphite。<code>預設</code> 會恢復 LYNX 自己的主題。</li></ol>
<h2 id="colors-and-text-size">顏色和文字大小</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-2.webp"><img src="/assets/img/learn/make-it-yours-2.webp" alt="General 頁面中的文字大小和粗體文字" loading="lazy" width="690" height="685"></a></figure>
<ol><li>旋鈕可調整色相、飽和度、亮度和對比；每個圓點為一個部分上色，例如音軌或電平表。</li><li>在 <code>一般</code> 頁面中，<code>文字大小</code> 和 <code>粗體文字</code> 能讓介面更容易閱讀。</li></ol>
<h2 id="language-and-restart">語言和重新啟動</h2>
<figure><a class="shot" href="/assets/img/learn/make-it-yours-3.webp"><img src="/assets/img/learn/make-it-yours-3.webp" alt="重新啟動後文字更大更粗的 LYNX" loading="lazy" width="1280" height="720"></a></figure>
<ol><li><code>語言</code> 列出 LYNX SHARE 的十五種語言。</li><li>新的語言、字型、文字大小或粗體文字會在 LYNX SHARE 再次啟動時生效。</li></ol>
<p>另請參閱<a href="/wiki/settings/">設定</a>。</p>
