<h2 id="select-a-track">選擇音軌</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-1.webp"><img src="/assets/img/learn/mixer-routing-1.webp" alt="選取了和弦的混音器" loading="lazy" width="1280" height="401"></a></figure>
<ol><li>按 <code>F9</code> 開啟混音器。每條音軌都送往主控。</li><li>點擊你想傳送的音軌，這裡是和弦。</li></ol>
<h2 id="route-and-send-level">路由和傳送電平</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-2.webp"><img src="/assets/img/learn/mixer-routing-2.webp" alt="路由箭頭及其傳送旋鈕" loading="lazy" width="1040" height="280"></a></figure>
<ol><li>點擊另一條音軌下方的箭頭：選取的音軌現在也會送到那裡，並有一條線纜顯示這條路由。</li><li>箭頭下方的旋鈕是傳送電平：決定這條音軌有多少送到那裡。</li></ol>
<h2 id="a-reverb-bus">殘響匯流排</h2>
<figure><a class="shot" href="/assets/img/learn/mixer-routing-3.webp"><img src="/assets/img/learn/mixer-routing-3.webp" alt="匯流排音軌上的殘響" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>在那條音軌的第一個插槽加上殘響：路由到那裡的每條音軌都共用它，同時保有各自的推桿。</li><li>在箭頭上按右鍵可看到更多選項：<code>僅路由到此軌道</code> 會移走整條音軌，<code>側鏈到此軌道</code> 會傳送一個訊號供壓縮器監聽。</li></ol>
<p>另請參閱<a href="/wiki/mixer/">混音器</a>、<a href="/learn/mixing-basics/">混音基礎</a>和<a href="/learn/sidechain/">側鏈</a>。</p>
