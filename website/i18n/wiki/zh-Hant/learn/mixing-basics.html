<h2 id="the-mixer">混音器</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-1.webp"><img src="/assets/img/learn/mixing-basics-1.webp" alt="每條音軌一個通道條的混音器" loading="lazy" width="940" height="470"></a></figure>
<ol><li>按 <code>F9</code> 開啟混音器。每條音軌都有一個通道條：名稱、聲像、推桿、靜音、獨奏和電平表。</li><li>左邊的主控通道條就是你聽到的聲音，也是匯出時寫出的內容。</li></ol>
<h2 id="level-and-pan">電平和聲像</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-2.webp"><img src="/assets/img/learn/mixing-basics-2.webp" alt="被拉低的推桿" loading="lazy" width="940" height="470"></a></figure>
<ol><li>拖動推桿來設定音軌的電平。先調好電平，再加任何效果。</li><li>推桿上方的旋鈕把音軌聲像擺到左邊或右邊。</li></ol>
<h2 id="mute-solo-and-the-meter">靜音、獨奏和電平表</h2>
<figure><a class="shot" href="/assets/img/learn/mixing-basics-3.webp"><img src="/assets/img/learn/mixing-basics-3.webp" alt="一條音軌開啟了獨奏" loading="lazy" width="940" height="470"></a></figure>
<ol><li>綠色開關會讓音軌靜音；再點一次就恢復。</li><li><code>S</code> 會獨奏音軌：只聽到它。再點一次，就能聽到全部。</li><li>留意主控電平表：讓最響的峰值不要進入紅色區域。</li></ol>
<p>另見<a href="/wiki/mixer/">混音器</a>。</p>
