<h2 id="bring-in-the-vocal">匯入人聲</h2>
<figure><a class="shot" href="/assets/img/learn/vocal-chain-1.webp"><img src="/assets/img/learn/vocal-chain-1.webp" alt="拖到時間軸上的一段人聲錄音" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>在人聲音軌上錄下你的聲音，或把資料夾裡的錄音拖到時間軸上。</li><li>原始人聲需要幾個步驟才能聽起來完整。LYNX 把它們放在一個選單裡。</li></ol>
<h2 id="clean-voice">Clean voice</h2>
<figure><a class="shot" href="/assets/img/learn/vocal-chain-2.webp"><img src="/assets/img/learn/vocal-chain-2.webp" alt="音軌上的 Clean voice 效果鏈" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>右鍵點擊音軌，選擇 <code>清晰人聲</code>，再選擇 <code>含降噪的清晰人聲</code>。</li><li>這會加入一條已經為人聲設定好的效果鏈：降噪、EQ、門限、Hush 齒音消除器（它會柔化刺耳的 S 音）和壓縮器。</li></ol>
<h2 id="tune-and-reverb">調音和殘響</h2>
<figure><a class="shot" href="/assets/img/learn/vocal-chain-3.webp"><img src="/assets/img/learn/vocal-chain-3.webp" alt="LYNX Tune 和 Reverb 旋鈕" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>要校正音高，點擊效果器分頁中的 <code>+</code>，再選 <code>更多效果器...</code>，然後選 <code>LYNX Tune</code>。它會跟隨歌曲的調。</li><li>把 <code>殘響</code> 旋鈕稍微調大一點，讓人聲和音樂處在同一個空間裡。</li></ol>
<p>另見<a href="/wiki/recording/">錄音</a>。</p>
