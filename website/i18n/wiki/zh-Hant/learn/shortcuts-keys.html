<h2 id="the-shortcut-sheet">快速鍵表</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-1.webp"><img src="/assets/img/learn/shortcuts-keys-1.webp" alt="快速鍵表" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>按 <code>F1</code>（或 <code>說明 › 快速鍵</code>）：顯示每個視窗的按鍵，沿用 FL Studio 自己的。再按一次 <code>F1</code> 關閉。</li></ol>
<h2 id="change-a-shortcut">修改快速鍵</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-2.webp"><img src="/assets/img/learn/shortcuts-keys-2.webp" alt="Manage shortcuts" loading="lazy" width="870" height="640"></a></figure>
<ol><li>點擊快速鍵表底部的 <code>管理快速鍵...</code>，或開啟 <code>選項 › 管理快速鍵...</code>。</li><li>搜尋一個動作或按鍵，選取它，點擊 <code>變更</code>，然後按下新的按鍵。</li><li><code>僅已變更</code> 列出你改過的項目；<code>重設為預設</code> 把某個快速鍵恢復原樣。</li></ol>
<h2 id="the-typing-keyboard">打字鍵盤</h2>
<figure><a class="shot" href="/assets/img/learn/shortcuts-keys-3.webp"><img src="/assets/img/learn/shortcuts-keys-3.webp" alt="Piano roll 中演奏打字鍵盤的音符" loading="lazy" width="1280" height="720"></a></figure>
<ol><li><code>Ctrl+T</code> 開啟或關閉打字鍵盤（<code>選項 › 電腦鍵盤當鋼琴</code>）。</li><li>字母鍵會演奏選取的樂器：Z 到 M 是一個八度，Q 到 I 是下一個八度。</li></ol>
<p>另請參閱<a href="/wiki/shortcuts/">鍵盤快速鍵</a>。</p>
