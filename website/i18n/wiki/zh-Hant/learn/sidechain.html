<h2 id="what-sidechain-does">側鏈是做什麼的</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-1.webp"><img src="/assets/img/learn/sidechain-1.webp" alt="低音在鼓下面讓位" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>側鏈閃避會在另一條音軌每次發聲時壓低這條音軌，比如讓低音在大鼓下面讓位，這樣兩者都能聽清。</li></ol>
<h2 id="duck-under-simple-layout">Duck under（簡易版面）</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-2.webp"><img src="/assets/img/learn/sidechain-2.webp" alt="Duck under，Drums" loading="lazy" width="1000" height="480"></a></figure>
<ol><li>選擇低音音軌並開啟它的效果器分頁。</li><li>點擊 <code>閃避於</code> 並選擇鼓。低音現在會隨著節拍起伏；Duck 卡片上的旋鈕決定壓得多深。</li></ol>
<h2 id="mixer-sidechain-pattern-layout">混音器側鏈（模式版面）</h2>
<figure><a class="shot" href="/assets/img/learn/sidechain-3.webp"><img src="/assets/img/learn/sidechain-3.webp" alt="混音器中的 Sidechain to this track" loading="lazy" width="940" height="480"></a></figure>
<ol><li>在混音器中選擇鼓音軌，右鍵點擊和弦音軌下方的箭頭：<code>側鏈到此軌道</code>。</li><li>給和弦音軌新增一個壓縮器：它會監聽鼓，每次鼓點都把和弦壓下去。</li></ol>
<p>另見<a href="/wiki/mixer/">混音器</a>。</p>
