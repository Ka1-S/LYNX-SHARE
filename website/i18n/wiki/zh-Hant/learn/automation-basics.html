<h2 id="create-an-automation-clip">建立自動化片段</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-1.webp"><img src="/assets/img/learn/automation-basics-1.webp" alt="旋鈕的選單：Create automation clip" loading="lazy" width="840" height="630"></a></figure>
<ol><li>右鍵點擊任意旋鈕，這裡是合成器的 Cutoff，然後選擇 <code>建立自動化片段</code>。</li><li>片段會放進播放清單，長度和樣式一樣，並且 Channel rack 中會出現它的通道。</li></ol>
<h2 id="shape-the-curve">塑造曲線</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-2.webp"><img src="/assets/img/learn/automation-basics-2.webp" alt="自動化編輯器" loading="lazy" width="1060" height="700"></a></figure>
<ol><li>自動化編輯器會開啟，顯示該片段的曲線。之後想再開啟，請右鍵點擊旋鈕並選擇 <code>編輯自動化片段...</code>。</li><li>拖動點來塑造曲線；點擊可新增點。這裡 Cutoff 從高處開始，在一個小節內下降。</li></ol>
<h2 id="hear-it">聽聽效果</h2>
<figure><a class="shot" href="/assets/img/learn/automation-basics-3.webp"><img src="/assets/img/learn/automation-basics-3.webp" alt="旋鈕跟隨曲線" loading="lazy" width="760" height="285"></a></figure>
<ol><li>在歌曲模式中按播放：每次播放歌曲時，旋鈕都會跟隨曲線。</li><li>在簡易版面中，<code>自動化</code> 按鈕會在每條音軌下顯示一條可以繪製的軌道。</li></ol>
<p>另見<a href="/wiki/automation/">自動化</a>。</p>
