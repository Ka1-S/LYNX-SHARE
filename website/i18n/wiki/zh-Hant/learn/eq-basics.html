<h2 id="add-an-eq">新增 EQ</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-1.webp"><img src="/assets/img/learn/eq-basics-1.webp" alt="和弦音軌上的 Facet EQ" loading="lazy" width="1280" height="720"></a></figure>
<ol><li>在混音器中選擇音軌並點擊一個空插槽，然後選擇 <code>Facet EQ</code>。</li><li>圖表顯示聲音的頻譜。雙擊圖表可新增一個頻段。</li></ol>
<h2 id="cut-and-boost">衰減和提升</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-2.webp"><img src="/assets/img/learn/eq-basics-2.webp" alt="低切和 300 Hz 附近的衰減" loading="lazy" width="1000" height="660"></a></figure>
<ol><li>把 80 Hz 附近的頻段設為 <code>低切</code>：它會去掉低音下面的隆隆聲。</li><li>在 300 Hz 附近新增一個頻段並稍微往下拖：渾濁感減少。</li><li>在 3 kHz 附近稍微提升一點，音符就會更靠前。上下拖動頻段調整增益，左右拖動調整頻率；用滾輪調整寬度。</li></ol>
<h2 id="compare">對比</h2>
<figure><a class="shot" href="/assets/img/learn/eq-basics-3.webp"><img src="/assets/img/learn/eq-basics-3.webp" alt="試聽開關：EQ 和 Source" loading="lazy" width="1000" height="660"></a></figure>
<ol><li>點擊 <code>來源</code> 可在相同響度下聽沒有 EQ 的音軌；點擊 <code>EQ</code> 就恢復。</li><li>小幅調整就足夠了。多聽，少看。</li></ol>
<p>另見<a href="/wiki/mixer/">混音器</a>。</p>
