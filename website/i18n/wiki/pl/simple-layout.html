<p><code>Widok › Styl układu</code> w 0.1.25 ma dwie pozycje: <code>Praca na wzorcach (domyślnie)</code> i <code>Praca z uruchamianiem klipów</code>. Domyślny układ opisuje <a href="/wiki/getting-started/">Zacznij tutaj</a>.</p>
